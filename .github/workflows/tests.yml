name: Tests

# The full pytest suite. Until 2026-10-05 the only workflow here was the
# payments guard, so ~2,300 tests ran nowhere: `main` sat with 57 failures
# while every PR showed a green check. This runs all of them.
#
# No secrets and no network. main.py loads .env with override=False and .env is
# gitignored, so the checkout runs on the placeholders below; Supabase is faked
# or stubbed per test. The handful of tests that need a REAL database are marked
# `live_db` (see tests/conftest.py) and skipped here — they verify live schema
# and cannot run against a placeholder.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Deliberate placeholders, never real credentials. main.py builds its LLM
      # and Supabase clients at IMPORT time and both constructors raise on a
      # missing key, so importing main.py at all needs these present. Nothing
      # built from them is ever called, and nothing leaves the runner.
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key
      IAP_TEST_MODE: "1"
      # Skips the `live_db` tests, which check the real schema.
      ANTAR_SKIP_LIVE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt (Railway builds on 3.11).
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Guard — no .env leaked into the checkout
        run: |
          if [ -f .env ]; then
            echo "::error::.env is present in CI. It is gitignored and must never be committed."
            exit 1
          fi

      - name: Guard — every live_db test is really marked, not silently skipped
        # A test that needs the real schema must carry the marker. If someone
        # reverts to `skipif(not SUPABASE_URL)`, the placeholder satisfies it and
        # the test RUNS here and fails — which is exactly how the suite fell out
        # of CI in the first place.
        run: |
          if grep -rn 'skipif(not os.getenv("SUPABASE_URL")' tests/; then
            echo "::error::use @pytest.mark.live_db instead — a CI placeholder satisfies this skipif"
            exit 1
          fi

      - name: Full test suite
        run: python -m pytest tests/ -q --durations=10
