name: Payments tests

# These tests guard money: a regression here silently cuts off paying
# subscribers at their first renewal, keeps serving refunded ones, or
# charges a price the product never advertised.
#
# They need NO secrets and NO network. main.py loads .env with
# override=False, and .env is gitignored, so the checkout runs on defaults;
# Supabase is replaced with a fake and the store APIs are stubbed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IAP_TEST_MODE: "1"
      # main.py builds its LLM and Supabase clients at IMPORT time, and both
      # constructors raise on a missing key — so importing main.py at all needs
      # these present. They are deliberate placeholders, never real credentials:
      # the tests swap in a fake Supabase and stub the store APIs, so no client
      # built from these is ever called and nothing leaves the runner.
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches runtime.txt (Railway builds on 3.11).
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard — no .env leaked into the checkout
        run: |
          if [ -f .env ]; then
            echo "::error::.env is present in CI. It is gitignored and must never be committed."
            exit 1
          fi

      - name: Guard — renewal routes are wired into main.py
        run: |
          missing=0
          for route in \
            "@app.post(\"/api/v1/payments/apple/notifications\")" \
            "@app.post(\"/api/v1/payments/google/rtdn\")"; do
            if ! grep -qF "$route" main.py; then
              echo "::error::missing route in main.py: $route"
              missing=1
            fi
          done
          exit $missing

      - name: JWS forgery rejection (9 tests)
        # Runs first and alone: if certificate-chain validation regresses,
        # a forged Apple notification buys a free subscription forever.
        run: python tools/test_iap_jws_security.py

      - name: Parsing and action mapping
        run: python antar_engine/iap_renewals.py

      - name: Webhook endpoints end-to-end (26 tests)
        run: python tools/test_iap_renewals.py

      - name: Purchase-time verification self-test
        run: python antar_engine/iap_engine.py

      - name: Pricing table consistency (49 tests)
        # Guards against the two pricing tables drifting apart again — a live
        # product must never appear in the deprecated-tier fallback, and every
        # annual plan must actually beat 12x monthly.
        run: python tools/test_pricing_consistency.py
